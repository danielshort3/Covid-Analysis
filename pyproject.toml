[project]
name = "covid-icu-capacity-analysis"
version = "0.1.0"
description = "Historical evaluation of seven-day state ICU occupancy forecasts"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "xgboost>=3,<4",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6,<8",
  "nbconvert>=7,<8",
  "nbformat>=5.10,<6",
]

[tool.uv]
package = false
